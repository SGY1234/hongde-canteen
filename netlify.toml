# Netlify 配置 —— 从 GitHub 自动构建时用这一份。
#
# 关键点：连接 GitHub 后，Netlify 会跑它自己的构建流程，
# 这时**必须**告诉它静态文件在 public/ 目录，否则首页会 404。
# （和"直接拖 ZIP 上传"不同：那种方式不做构建，静态文件必须放在仓库根目录。
#   两种方式的配置需求是相反的，所以我在这里写清楚。）
#
# 注释符必须是 #（TOML 标准）。原先写的 // 在宽松解析器下能过，
# 解析器一严格就会让整份配置失效（首页 404），所以统一改成 #。
#
# 另外 netlify/functions 里放的是自包含云函数（内嵌了后端代码和菜单数据），
# 由 scripts/build-function.js 生成。改了 server/ 下的代码要重新生成并提交。

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "none"

# 所有 /api/* 交给云函数（它复用 server/local.js 的同一份代码）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# 菜单数据不缓存，改完立刻生效
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"
